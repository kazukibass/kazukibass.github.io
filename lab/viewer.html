<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ノート | kazuki</title>
<meta name="robots" content="noindex">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e0e0f" media="(prefers-color-scheme: dark)">
<link rel="stylesheet" href="../assets/base.css">
<script src="../assets/theme.js"></script>
<style>
  .layout{display:grid; grid-template-columns:minmax(0,760px) 240px; gap:56px;
    max-width:1104px; margin:0 auto; padding:0 24px; align-items:start}
  @media(max-width:940px){ .layout{display:block; max-width:808px} .toc{display:none} }

  /* ---------- article head ---------- */
  .ahead{padding:48px 0 22px; border-bottom:1px solid var(--line); margin-bottom:36px}
  .back{display:inline-flex; align-items:center; gap:7px; font-size:13px;
    color:var(--fg-dim); text-decoration:none; margin-bottom:20px; transition:.16s}
  .back:hover{color:var(--accent)}
  .back svg{width:14px;height:14px}
  .ahead h1{margin:0 0 12px; font-size:clamp(26px,4vw,36px); line-height:1.35;
    font-weight:800; letter-spacing:-.02em}
  .ameta{display:flex; flex-wrap:wrap; gap:10px; align-items:center;
    font-size:12.5px; color:var(--fg-dim)}
  .ameta .ntag{font-size:11px; padding:3px 8px; border-radius:6px;
    background:var(--bg-sunk); color:var(--fg-dim); border:1px solid var(--line)}

  /* ---------- article body ---------- */
  .doc{padding-bottom:70px; font-size:16.5px; line-height:2; overflow-wrap:anywhere}
  .doc > *:first-child{margin-top:0}
  .doc h1,.doc h2,.doc h3,.doc h4{
    line-height:1.5; letter-spacing:-.01em; font-weight:750; scroll-margin-top:86px;
  }
  .doc h1{font-size:26px; margin:52px 0 16px}
  .doc h2{font-size:22px; margin:52px 0 16px; padding-bottom:9px; border-bottom:1px solid var(--line)}
  .doc h3{font-size:18px; margin:38px 0 12px}
  .doc h4{font-size:15.5px; margin:28px 0 10px; color:var(--fg-mut)}
  .doc p{margin:0 0 20px}
  .doc > p:first-child{font-size:17.5px; line-height:1.9; color:var(--fg-mut);
    padding:18px 20px; margin-bottom:34px; background:var(--bg-sunk);
    border:1px solid var(--line); border-radius:12px}
  .doc a{color:var(--accent); text-decoration:underline; text-underline-offset:3px;
    text-decoration-thickness:1px}
  .doc ul,.doc ol{margin:0 0 20px; padding-left:1.5em}
  .doc li{margin:0 0 8px}
  .doc li > ul,.doc li > ol{margin-top:8px}
  .doc strong{font-weight:700}
  .doc hr{border:0; border-top:1px solid var(--line); margin:44px 0}
  .doc blockquote{
    margin:0 0 20px; padding:4px 0 4px 20px;
    border-left:3px solid var(--accent-soft); color:var(--fg-mut);
  }
  .doc blockquote p:last-child{margin-bottom:0}
  .doc code{
    font-family:var(--mono); font-size:.875em;
    background:var(--bg-sunk); border:1px solid var(--line);
    padding:2px 6px; border-radius:6px;
  }
  .doc pre{
    margin:0 0 22px; padding:18px 20px; overflow-x:auto;
    background:var(--bg-sunk); border:1px solid var(--line); border-radius:12px;
    line-height:1.7;
  }
  .doc pre code{background:none; border:0; padding:0; font-size:13.5px}
  .doc table{
    width:100%; border-collapse:collapse; margin:0 0 22px; font-size:14.5px;
    display:block; overflow-x:auto;
  }
  .doc th,.doc td{border:1px solid var(--line); padding:9px 13px; text-align:left}
  .doc th{background:var(--bg-sunk); font-weight:650}
  .doc img{max-width:100%; height:auto; border-radius:10px; border:1px solid var(--line)}
  .doc input[type=checkbox]{margin-right:8px; accent-color:var(--accent)}
  .doc li:has(> input[type=checkbox]){list-style:none; margin-left:-1.5em}

  /* ---------- toc ---------- */
  .toc{position:sticky; top:86px; padding:48px 0 0; font-size:13px}
  .toc-h{font-size:11px; letter-spacing:.13em; text-transform:uppercase;
    color:var(--fg-dim); margin:0 0 12px}
  .toc ul{list-style:none; margin:0; padding:0; border-left:1px solid var(--line)}
  .toc li a{
    display:block; padding:6px 0 6px 14px; margin-left:-1px;
    color:var(--fg-dim); text-decoration:none; border-left:2px solid transparent;
    line-height:1.5; transition:.16s;
  }
  .toc li a:hover{color:var(--fg)}
  .toc li a.on{color:var(--accent); border-left-color:var(--accent)}
  .toc li.lv3 a{padding-left:26px; font-size:12.5px}

  .toc-mobile{display:none; margin:-12px 0 34px; border:1px solid var(--line);
    border-radius:12px; background:var(--bg-elev); overflow:hidden}
  .toc-mobile summary{padding:13px 16px; cursor:pointer; font-size:13px;
    font-weight:700; color:var(--fg-mut)}
  .toc-mobile ul{list-style:none; margin:0; padding:0 16px 14px; columns:2; column-gap:24px}
  .toc-mobile li{break-inside:avoid; margin:0}
  .toc-mobile a{display:block; padding:6px 0; color:var(--fg-dim);
    text-decoration:none; font-size:12.5px; line-height:1.45}
  .toc-mobile li.lv3 a{padding-left:12px}
  .toc-mobile[hidden]{display:none}
  @media(max-width:940px){.toc-mobile{display:block}}
  @media(max-width:560px){.toc-mobile ul{columns:1}}

  .state{border:1px dashed var(--line-str); border-radius:var(--radius);
    padding:46px 26px; text-align:center; color:var(--fg-mut); font-size:14.5px; margin:40px 0}
  .state code{font-family:var(--mono); font-size:13px; background:var(--bg-sunk);
    padding:2px 7px; border-radius:6px; border:1px solid var(--line)}
</style>
</head>
<body>

<header>
  <div class="wrap hdr">
    <a class="mark" href="../"><span class="dot">K</span>KAZUKI<span class="sub">/ Lab</span></a>
    <nav>
      <a href="../">トップ</a>
      <a href="./">ノート一覧</a>
      <button class="tglr" id="tgl" aria-label="テーマ切替" title="ライト / ダーク切替">
        <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </nav>
  </div>
</header>

<main class="layout">
  <article>
    <div class="ahead">
      <a class="back" href="./">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        ノート一覧
      </a>
      <h1 id="title">読み込み中…</h1>
      <div class="ameta" id="ameta"></div>
    </div>
    <details class="toc-mobile" id="tocmobile" hidden>
      <summary>目次を表示</summary>
      <ul id="tocmobilelist"></ul>
    </details>
    <div class="doc" id="doc"></div>
    <div class="state" id="state" hidden></div>
  </article>

  <aside class="toc" id="toc" hidden>
    <p class="toc-h">目次</p>
    <ul id="toclist"></ul>
  </aside>
</main>

<footer>
  <div class="wrap ft">
    <span>© 2026 kazuki</span>
    <span><a href="./">ノート一覧に戻る</a></span>
  </div>
</footer>

<script src="../assets/vendor/marked.min.js"></script>
<script src="../assets/vendor/purify.min.js"></script>
<script>
(function () {
  var docEl   = document.getElementById('doc');
  var stateEl = document.getElementById('state');
  var titleEl = document.getElementById('title');
  var metaEl  = document.getElementById('ameta');
  var tocEl   = document.getElementById('toc');
  var tocList = document.getElementById('toclist');
  var tocMobile = document.getElementById('tocmobile');
  var tocMobileList = document.getElementById('tocmobilelist');

  function esc(s) {
    var d = document.createElement('div');
    d.textContent = s == null ? '' : String(s);
    return d.innerHTML;
  }
  function fail(msg) {
    titleEl.textContent = 'ノートを表示できません';
    stateEl.hidden = false;
    stateEl.innerHTML = msg;
  }

  var file = new URLSearchParams(location.search).get('f');
  if (!file) { fail('URLに <code>?f=ファイル名</code> が指定されていません。'); return; }

  // notes.json に登録されたファイルだけを開く（任意のパスを読ませないため）
  fetch('notes.json', { cache: 'no-cache' })
    .then(function (r) { if (!r.ok) throw new Error('notes.json が読めません'); return r.json(); })
    .then(function (notes) {
      var note = (notes || []).filter(function (n) { return n.file === file; })[0];
      if (!note) {
        throw new Error('<code>' + esc(file) + '</code> は notes.json に登録されていません。');
      }
      document.title = (note.title || 'ノート') + ' | kazuki';
      titleEl.textContent = note.title || '(無題)';
      metaEl.innerHTML =
        (note.date ? '<span>' + esc(note.date) + '</span>' : '') +
        (note.tags || []).map(function (t) { return '<span class="ntag">' + esc(t) + '</span>'; }).join('');

      return fetch(note.file, { cache: 'no-cache' }).then(function (r) {
        if (!r.ok) throw new Error('<code>' + esc(note.file) + '</code> が見つかりません。');
        return r.text();
      });
    })
    .then(function (md) {
      marked.setOptions({ gfm: true, breaks: false });
      docEl.innerHTML = DOMPurify.sanitize(marked.parse(md));
      buildToc();
    })
    .catch(function (e) { fail(e.message); });

  function buildToc() {
    var hs = docEl.querySelectorAll('h2, h3');
    if (hs.length < 2) return;

    var used = {};
    var items = [];
    hs.forEach(function (h, i) {
      var base = (h.textContent || 'section').trim()
        .toLowerCase().replace(/\s+/g, '-').replace(/[^\w぀-ヿ一-龯-]/g, '');
      var id = base || 'h' + i;
      if (used[id]) { id = id + '-' + (++used[id]); } else { used[id] = 1; }
      h.id = id;
      items.push({ id: id, text: h.textContent, lv: h.tagName === 'H3' ? 3 : 2 });
    });

    var tocHtml = items.map(function (it) {
      return '<li class="lv' + it.lv + '"><a href="#' + esc(it.id) + '">' + esc(it.text) + '</a></li>';
    }).join('');
    tocList.innerHTML = tocHtml;
    tocMobileList.innerHTML = tocHtml;
    tocEl.hidden = false;
    tocMobile.hidden = false;

    tocMobileList.querySelectorAll('a').forEach(function (a) {
      a.addEventListener('click', function () { tocMobile.open = false; });
    });

    // スクロールに合わせて現在地をハイライト
    var links = {};
    tocList.querySelectorAll('a').forEach(function (a) {
      links[a.getAttribute('href').slice(1)] = a;
    });
    var obs = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) {
        var a = links[en.target.id];
        if (!a) return;
        if (en.isIntersecting) {
          Object.keys(links).forEach(function (k) { links[k].classList.remove('on'); });
          a.classList.add('on');
        }
      });
    }, { rootMargin: '-80px 0px -70% 0px' });
    hs.forEach(function (h) { obs.observe(h); });
  }
})();
</script>
</body>
</html>
